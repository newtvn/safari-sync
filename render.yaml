services:
  - type: web
    name: safari-sync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_SANDBOX
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
